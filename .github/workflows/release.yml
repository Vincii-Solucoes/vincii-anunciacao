name: Release

# Ao enviar uma tag "vX.Y.Z", compila os instaladores em macOS, Windows e Linux
# e publica todos num único GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # sem certificado: não tenta assinar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compilar interface
        run: npm run build

      - name: Gerar instaladores
        run: npx --no-install electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Criar o Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.dmg artifacts/*.zip artifacts/*.exe artifacts/*.AppImage artifacts/*.deb)
          printf ' - %s\n' "${files[@]}"
          if [ ${#files[@]} -eq 0 ]; then echo "Nenhum instalador"; exit 1; fi
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          cat > /tmp/notes.md <<'NOTES'
          ## Downloads

          | Sistema | Arquivo |
          |---|---|
          | **Windows** (64 bits) | `Anunciacao-…-win-x64.exe` |
          | **macOS** Apple Silicon (M1/M2/M3/M4) | `Anunciacao-…-mac-arm64.dmg` |
          | **macOS** Intel | `Anunciacao-…-mac-x64.dmg` |
          | **Linux** | `.AppImage` (qualquer distro) ou `.deb` (Debian/Ubuntu) |

          ## Instalação

          **macOS** — o app ainda não é assinado pela Apple. Na primeira abertura: botão direito no app → **Abrir** → **Abrir**.
          Se aparecer *"está danificado"*, rode uma vez no Terminal e abra de novo:
          ```
          xattr -cr "/Applications/Anunciacao.app"
          ```

          **Windows** — o instalador ainda não é assinado; se o SmartScreen avisar, clique em **Mais informações → Executar assim mesmo**.

          **Linux** — AppImage: `chmod +x Anunciacao-*.AppImage` e execute. A bandeja do sistema requer suporte a AppIndicator (no GNOME, a extensão *AppIndicator*).

          **Requisito do PBX:** SIP via UDP, TCP ou TLS com codec G.711 (PCMA/PCMU).
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Anunciação $GITHUB_REF_NAME" --notes-file /tmp/notes.md "${files[@]}"
