; PBX de teste (Asterisk em Docker) — veja scripts/test-pbx.sh
[global]
type=global
user_agent=VINCII-Test-PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[ep](!)
type=endpoint
context=internal
disallow=all
allow=alaw,ulaw,g722,opus,g729
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[au](!)
type=auth
auth_type=userpass

[ao](!)
type=aor
max_contacts=10
remove_existing=no

[1001](ep)
auth=1001
aors=1001
callerid="Ramal 1001" <1001>
[1001](au)
username=1001
password=senha1001
[1001](ao)

[1002](ep)
